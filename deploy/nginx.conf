# Add inside your existing nginx config (e.g. /etc/nginx/conf.d/srt.conf), then: nginx -t && systemctl reload nginx
# Replace the hostname and the certificate paths with your own (certbot --nginx -d srt.example.com does this for you).
server {
    listen 80;
    server_name srt.example.com;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
